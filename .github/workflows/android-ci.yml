# SOEN345 - Ticket Reservation App CI
# Builds the Android app and runs unit and instrumentation tests on every push and pull request.
name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests and generate coverage report
        run: ./gradlew testDebugUnitTest jacocoTestCoverageVerification --no-daemon

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import csv
          import sys

          report = pathlib.Path("app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.csv")
          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])

          if not report.exists():
              summary_path.write_text("### Test Coverage\n\nJacoco report not found.\n", encoding="utf-8")
              sys.exit(0)

          rows = list(csv.reader(report.read_text(encoding="utf-8").splitlines()))
          if len(rows) < 2:
              summary_path.write_text("### Test Coverage\n\nLine coverage data was not found.\n", encoding="utf-8")
              sys.exit(0)

          header = rows[0]

          try:
              line_missed_index = header.index("LINE_MISSED")
              line_covered_index = header.index("LINE_COVERED")
              missed = 0
              covered = 0

              for row in rows[1:]:
                  if len(row) <= max(line_missed_index, line_covered_index):
                      continue
                  missed += int(row[line_missed_index])
                  covered += int(row[line_covered_index])
          except (ValueError, IndexError):
              summary_path.write_text("### Test Coverage\n\nLine coverage data was not found.\n", encoding="utf-8")
              sys.exit(0)

          total = covered + missed
          percent = (covered / total * 100.0) if total else 0.0

          summary_path.write_text(
              f"### Test Coverage\n\nDebug unit test line coverage: **{percent:.2f}%**\n",
              encoding="utf-8",
          )
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-and-coverage-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/jacoco/
            app/build/reports/coverage/
            app/build/outputs/code_coverage/
            app/build/test-results/

  instrumentation-tests:
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Android emulator
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api33-pixel5

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-boot-timeout: 8
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          disable-spellchecker: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-boot-timeout: 8
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          script: ./gradlew connectedDebugAndroidTest createDebugCoverageReport --no-daemon
